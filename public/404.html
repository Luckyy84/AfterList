<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#050608" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <title>Page not found | AfterList</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #050608; color: #f5f2ec; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; background: radial-gradient(circle at 18% 48%, rgba(255,90,0,.12), transparent 32%), #050608; }
      main { position: relative; width: min(1120px, 100%); min-height: min(620px, 78vh); display: grid; grid-template-columns: minmax(240px,.75fr) minmax(320px,1.25fr); align-items: center; gap: clamp(30px,6vw,90px); overflow: hidden; border: 1px solid rgba(245,242,236,.14); border-radius: 22px; padding: clamp(34px,7vw,92px); background: linear-gradient(135deg,rgba(24,21,18,.98),rgba(8,8,8,.98)); box-shadow: 0 24px 70px rgba(0,0,0,.32); }
      main::after { position: absolute; right: -10%; bottom: -42%; width: 64%; aspect-ratio: 1; border: 1px solid rgba(255,90,0,.18); border-radius: 50%; content: ""; box-shadow: 0 0 90px rgba(255,90,0,.08); }
      .code { position: relative; z-index: 1; color: #ff5a00; font-size: clamp(96px,15vw,210px); font-weight: 850; letter-spacing: -.09em; line-height: .8; text-shadow: 0 18px 60px rgba(255,90,0,.2); }
      .copy { position: relative; z-index: 1; display: grid; gap: 18px; }
      h1,p { margin: 0; }
      h1 { max-width: 680px; font-size: clamp(38px,5vw,70px); letter-spacing: -.045em; line-height: 1.02; }
      p { max-width: 560px; color: #aaa49b; font-size: clamp(15px,1.7vw,19px); line-height: 1.65; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }
      a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid rgba(245,242,236,.22); border-radius: 10px; padding: 12px 20px; color: #f5f2ec; font-size: 14px; font-weight: 750; text-decoration: none; }
      a:first-child { border-color: #ff5a00; color: #160b05; background: #ff5a00; }
      a:focus-visible { outline: 2px solid #f5f2ec; outline-offset: 4px; }
      @media (max-width:700px) { body { padding: 16px; } main { min-height: 640px; grid-template-columns: 1fr; align-content: center; gap: 44px; padding: 36px 24px; } .code { font-size: clamp(96px,32vw,150px); } h1 { font-size: clamp(38px,12vw,56px); } nav { display: grid; } }
    </style>
  </head>
  <body>
    <main>
      <span class="code" aria-hidden="true">404</span>
      <div class="copy">
        <h1>This story isn&rsquo;t on the list.</h1>
        <p>The page may have moved, or the link may no longer be available.</p>
        <nav aria-label="Page not found actions"><a href="/">Go home</a><a href="/discover">Discover titles</a></nav>
      </div>
    </main>
  </body>
</html>
